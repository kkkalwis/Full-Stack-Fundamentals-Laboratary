<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do-List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
         <nav class="navbar navbar-dark bg-primary shadow-sm">
            <div class="container">
            <span class="navbar-brand fw-semibold mb-0">My To-Do List</span>
            </div>
        </nav>
    </header>

    <main class="container py-4 py-md-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-7 col-xl-6">

            <div class="card app-card border-0 shadow-sm">
                <div class="card-body p-3 p-sm-4">

                <h1 class="h3 fw-bold text-center mb-1">Task Manager</h1>
                <p class="text-center text-muted small mb-4">Organize your tasks and stay productive.</p>

                
                <form id="taskForm" novalidate>
                    <div class="input-group has-validation">
                    <input type="text" id="taskInput" class="form-control"
                            placeholder="Enter a new task..." aria-label="New task" autocomplete="off">
                    <button type="submit" id="addBtn" class="btn btn-primary">Add Task</button>
                    <div id="errorMsg" class="invalid-feedback">Please enter a task. It cannot be empty or only spaces.</div>
                    </div>
                </form>

               
                <div class="d-flex justify-content-between align-items-center mt-3 mb-2">
                    <span class="small text-muted">Your tasks</span>
                    <span id="taskCounter" class="badge text-bg-primary rounded-pill">0 remaining</span>
                </div>

                <!-- Filters -->
                <div class="btn-group w-100 mb-3" role="group" aria-label="Filter tasks">
                    <button type="button" class="btn btn-sm btn-primary filter-btn" data-filter="all">All</button>
                    <button type="button" class="btn btn-sm btn-outline-primary filter-btn" data-filter="active">Active</button>
                    <button type="button" class="btn btn-sm btn-outline-primary filter-btn" data-filter="completed">Completed</button>
                </div>

                <!-- Task list + empty message -->
                <ul id="taskList" class="list-group mb-3"></ul>
                <p id="emptyMsg" class="text-center text-muted small my-4">No tasks yet. Add your first task!</p>

                
                <div class="text-end">
                    <button type="button" id="clearBtn" class="btn btn-sm btn-outline-danger">Clear Completed</button>
                </div>

                </div>
            </div>

            </div>
        </div>
        </main>

        <footer>
            <div>
                <P class="text-center text-muted small mb-4">Full-Stack Development Practical</P>
            </div>
        </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
